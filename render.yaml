services:
  - type: web
    name: conectando-a-comunidade
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm exec drizzle-kit migrate && pnpm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conectando-a-comunidade-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
  - type: cron
    name: conectando-a-comunidade-conteudo
    runtime: node
    plan: 0.5c-512mb
    schedule: "0 11,17 * * *"
    buildCommand: pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm exec tsx scripts/sync-content.ts auto
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conectando-a-comunidade-db
          property: connectionString
databases:
  - name: conectando-a-comunidade-db
    plan: free
    databaseName: campo_comprido
    user: campo_comprido
