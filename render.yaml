services:
  - type: web
    name: conectando-a-comunidade
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm exec drizzle-kit migrate && pnpm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conectando-a-comunidade-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
databases:
  - name: conectando-a-comunidade-db
    plan: free
    databaseName: campo_comprido
    user: campo_comprido
